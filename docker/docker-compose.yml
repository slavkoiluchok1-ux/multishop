services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      PORT: 8000
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - appdata:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  telegram_bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
    command: ["python", "manage.py", "run_telegram_bot"]
    volumes:
      - appdata:/data
    depends_on:
      web:
        condition: service_healthy
    profiles:
      - bot

volumes:
  appdata:
